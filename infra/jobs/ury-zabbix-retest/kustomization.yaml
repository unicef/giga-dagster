# Render/apply:  kubectl apply -k infra/jobs/ury-zabbix-retest
# Pipeline sets the image, e.g.:
#   kustomize edit set image ury-zabbix-retest=<registry>/ury-zabbix-retest:<tag>
# A Job's pod template is immutable: delete the previous run before re-applying
#   kubectl delete job ury-zabbix-retest -n ictd-ooi-data-analysis-dev --ignore-not-found
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ictd-ooi-data-analysis-dev
resources:
  - job.yaml
images:
  - name: ury-zabbix-retest
    newName: ury-zabbix-retest  # replaced by the pipeline with <registry>/ury-zabbix-retest
    newTag: latest
